<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- P3+P9: favicon بدون خلفية بيضاء، مع cache-busting -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2.6.4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2.6.4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vodafone Fakka Premium</title>
    <!-- P8+P9: PWA theme black — prevents white flash -->
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png?v=2.6.4" />
    <!-- ══ CRITICAL: منع الشاشة البيضاء قبل React — يُظهر الخلفية السوداء فوراً ══ -->
    <style>
      html, body, #root {
        background: #050000;
        margin: 0; padding: 0;
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      html.light, html.light body, html.light #root {
        background: #f5f7fa !important;
      }
      /* Inline loading indicator — يظهر قبل React بالكامل */
      #boot-loader {
        position: fixed; inset: 0; z-index: 99999;
        background: #050000;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease;
      }
      html.light #boot-loader {
        background: #f5f7fa;
      }
      #boot-loader.hidden { opacity: 0; pointer-events: none; }
      @keyframes bl-pulse {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
    </style>
    <!-- ══ CRITICAL: تطبيق الثيم قبل React لمنع الوميض ══ -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('vfp_theme');
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
    <!-- P3: Web Manifest link -->
    <link rel="manifest" href="/manifest.json?v=2.6.4" />
    <!-- ── حماية أمنية: Security Headers ──────────────────────────────── -->
    <!-- منع تضمين التطبيق في iframe خارجي (Clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- منع تخزين الصفحات الحساسة في Cache الوسيط -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <!-- منع MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- الإحالات: لا ترسل معلومات Referer للخوادم الخارجية -->
    <meta name="referrer" content="no-referrer" />
    <!-- CSP: مصادر موثوقة فقط -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https://vchmsnavyhripakyvzom.supabase.co;
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://vchmsnavyhripakyvzom.supabase.co https://*.supabase.co https://miaoda-conversation-file.s3cdn.medo.dev https://*.medo.dev;
        connect-src 'self' https://vchmsnavyhripakyvzom.supabase.co wss://vchmsnavyhripakyvzom.supabase.co https://fcm.googleapis.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
      " />
    <!-- ────────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body style="background:#050000;margin:0;padding:0;">
    <!-- boot-loader: يظهر فوراً قبل React — يمنع الشاشة السوداء الفارغة -->
    <div id="boot-loader" style="position: fixed; inset: 0; z-index: 99999; background: #050000; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.3s ease;">
      <img src="/vfp-logo.png" alt="Vodafone Fakka Premium" style="width: 120px; height: 120px; animation: bl-pulse 2s infinite ease-in-out;" />
      <div id="startup-step-display" style="color: #666; font-size: 12px; margin-top: 16px; font-family: monospace;">Loading HTML...</div>
      <div id="startup-error-display" style="color: #ff4444; font-size: 12px; margin-top: 8px; max-width: 80%; text-align: center; word-break: break-all; font-family: monospace;"></div>
    </div>
    
    <script>
      window.__STARTUP_STEP__ = 'HTML Parsed';
      
      // Override console.log temporarily to update the screen if needed
      const originalLog = console.log;
      console.log = function(...args) {
        if (args[0] === '[Startup]') {
          const stepDiv = document.getElementById('startup-step-display');
          if (stepDiv) stepDiv.innerText = args[1];
        }
        originalLog.apply(console, args);
      };

      window.addEventListener('error', function(e) {
        const errDiv = document.getElementById('startup-error-display');
        if (errDiv) {
          errDiv.innerText += '\n[Err] ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        }
      });

      window.addEventListener('unhandledrejection', function(e) {
        const errDiv = document.getElementById('startup-error-display');
        if (errDiv) {
          errDiv.innerText += '\n[Rej] ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown Promise Rejection');
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
